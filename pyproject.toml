[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pod-hub"
version = "2.0.1"
description = "Self-hosted YouTube-to-podcast hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.40,<2",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.8,<3",
  "httpx[socks]>=0.27,<1",
  "pathvalidate>=3.3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "yt-dlp[default]>=2025.1.1"]

[project.scripts]
pod-hub = "podhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["podhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
