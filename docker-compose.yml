services:
  pod-hub:
    build: .
    ports:
      - "8000:8000"
    environment:
      BASE_URL: http://localhost:8000
      FETCH_BATCH_SIZE: 3
      SYNC_INTERVAL: 10
      MEDIA_DIR: /data/media
      DATABASE_PATH: /data/db/podhub.db
      LOG_LEVEL: INFO
      YTDLP_BIN: yt-dlp
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_JS_RUNTIMES: ${YTDLP_JS_RUNTIMES:-node}
      ALARM_URL: ${ALARM_URL:-}
      ALARM_CUSTOM_PSK: ${ALARM_CUSTOM_PSK:-}
      ALARM_TG_USER_ID: ${ALARM_TG_USER_ID:-}
      ALARM_TIMEOUT_SECONDS: ${ALARM_TIMEOUT_SECONDS:-10}
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./data:/data
