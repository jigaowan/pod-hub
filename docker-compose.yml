services:
  pod-hub:
    build: .
    ports:
      - "8000:8000"
    environment:
      BASE_URL: http://localhost:8000
      FETCH_BATCH_SIZE: 3
      SYNC_INTERVAL: 10
      MEDIA_DIR: /data/media
      DATABASE_PATH: /data/db/podhub.db
      LOG_LEVEL: INFO
      YTDLP_BIN: yt-dlp
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - ./data:/data
