<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pod Hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-muted: #fafafa;
        --ink: #15171a;
        --muted: #646b74;
        --faint: #8a919b;
        --border: #d9dde3;
        --border-strong: #c6ccd4;
        --accent: #1f5eff;
        --accent-hover: #174bd0;
        --ok: #137333;
        --warn: #9a6700;
        --error: #b42318;
        --radius: 8px;
        --shadow: 0 1px 2px rgba(21, 23, 26, 0.05);
      }
      * { box-sizing: border-box; }
      html { min-width: 320px; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
      }
      a {
        color: var(--accent);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      a:hover { text-decoration: underline; text-underline-offset: 3px; }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid rgba(31, 94, 255, 0.35);
        outline-offset: 2px;
      }
      .shell {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .page-title {
        margin: 0;
        font-size: clamp(1.65rem, 3vw, 2.25rem);
        line-height: 1.1;
        letter-spacing: 0;
      }
      .page-kicker {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .page-meta {
        display: grid;
        gap: 4px;
        margin-top: 10px;
      }
      .page-meta p,
      .help-text {
        margin: 0;
        color: var(--muted);
      }
      .help-text {
        max-width: 760px;
        font-size: 0.94rem;
      }
      .section {
        margin-top: 16px;
      }
      .surface {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .section-body {
        padding: 18px;
      }
      .stack { display: grid; gap: 14px; }
      .stack-sm { display: grid; gap: 8px; }
      .section-title {
        margin: 0;
        font-size: 1rem;
        line-height: 1.25;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }
      .status {
        display: inline-flex;
        width: fit-content;
        max-width: 100%;
        align-items: center;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid currentColor;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.35;
        text-transform: lowercase;
        overflow-wrap: anywhere;
      }
      .status.active, .status.audio_ready { color: var(--ok); }
      .status.pending_initial_sync, .status.queued, .status.fetching, .status.syncing { color: var(--warn); }
      .status.error, .status.failed { color: var(--error); }
      .status.discovered, .status.skipped { color: var(--muted); }
      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      table.admin-table {
        table-layout: fixed;
      }
      .channel-list-table .col-source { width: 13%; }
      .channel-list-table .col-kind { width: 9%; }
      .channel-list-table .col-feed { width: 25%; }
      .channel-list-table .col-status { width: 7%; }
      .channel-list-table .col-sync { width: 9%; }
      .channel-list-table .col-error { width: 27%; }
      .channel-list-table .col-actions { width: 10%; }
      .episode-table .col-id { width: 6%; }
      .episode-table .col-title { width: 30%; }
      .episode-table .col-status { width: 10%; }
      .episode-table .col-published { width: 14%; }
      .episode-table .col-feed { width: 10%; }
      .episode-table .col-transcript { width: 10%; }
      .episode-table .col-error { width: 20%; }
      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        background: var(--surface-muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      tbody tr:last-child td { border-bottom: 0; }
      td {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); }
      .actions {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 8px 12px;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        border: 1px solid transparent;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
      }
      .button:hover {
        background: var(--accent-hover);
        text-decoration: none;
      }
      .button.secondary {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--border-strong);
      }
      .button.secondary:hover {
        background: var(--surface-muted);
      }
      .button.danger {
        background: var(--surface);
        color: var(--error);
        border-color: rgba(180, 35, 24, 0.32);
      }
      .button.danger:hover {
        background: rgba(180, 35, 24, 0.07);
      }
      .text-button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 0;
        text-align: left;
      }
      .text-button:hover {
        color: var(--accent-hover);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      form { display: grid; gap: 10px; }
      form.inline-form {
        display: inline-block;
        margin: 0;
      }
      .actions form.inline-form {
        display: inline-grid;
      }
      label {
        color: var(--ink);
        font-weight: 650;
      }
      .checkbox-row {
        align-items: center;
        display: inline-flex;
        gap: 8px;
      }
      .checkbox-row input {
        margin: 0;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      input[type="text"]::placeholder,
      textarea::placeholder { color: var(--faint); }
      textarea {
        min-height: 180px;
        resize: vertical;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .error-box {
        border: 1px solid rgba(180, 35, 24, 0.28);
        background: rgba(180, 35, 24, 0.06);
        color: var(--error);
        padding: 10px 12px;
        border-radius: 6px;
      }
      .layout-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }
      .detail-grid .wide {
        grid-column: 1 / -1;
      }
      .definition-list {
        display: grid;
        gap: 10px;
        margin: 0;
      }
      .definition-row {
        display: grid;
        grid-template-columns: minmax(110px, 34%) minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .definition-row dt {
        color: var(--muted);
        font-weight: 650;
      }
      .definition-row dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .metric {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        background: var(--surface-muted);
      }
      .metric-value {
        display: block;
        font-size: 1.15rem;
        font-weight: 750;
        line-height: 1.2;
      }
      .metric-label {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .error-summary {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .error-snippet {
        display: -webkit-box;
        max-width: 100%;
        overflow: hidden;
        color: var(--muted);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .message-dialog {
        width: min(680px, calc(100vw - 32px));
        max-height: min(640px, calc(100vh - 48px));
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 20px 60px rgba(21, 23, 26, 0.22);
      }
      .message-dialog::backdrop {
        background: rgba(21, 23, 26, 0.32);
      }
      .message-dialog-panel {
        display: grid;
        gap: 14px;
        padding: 18px;
      }
      .message-dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .message-dialog-title {
        margin: 0;
        font-size: 1rem;
      }
      .message-dialog-body {
        max-height: min(420px, calc(100vh - 180px));
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--muted);
        font: inherit;
      }
      .form-panel {
        max-width: 780px;
      }
      .form-actions {
        margin-top: 4px;
      }
      code {
        background: rgba(21, 23, 26, 0.06);
        padding: 2px 6px;
        border-radius: 6px;
        overflow-wrap: anywhere;
      }
      @media (max-width: 760px) {
        .shell {
          padding: 20px 14px 36px;
        }
        .page-header {
          display: grid;
          gap: 14px;
        }
        .page-title {
          font-size: 1.65rem;
        }
        .actions,
        .page-header .actions,
        .form-actions {
          display: grid;
          width: 100%;
        }
        .actions form.inline-form {
          width: 100%;
        }
        .button {
          width: 100%;
          white-space: normal;
        }
        .section-body {
          padding: 14px;
        }
        .table-wrap {
          overflow-x: visible;
        }
        table.admin-table {
          table-layout: auto;
        }
        table.responsive-table,
        table.responsive-table thead,
        table.responsive-table tbody,
        table.responsive-table tr,
        table.responsive-table th,
        table.responsive-table td {
          display: block;
          width: 100%;
        }
        table.responsive-table thead {
          display: none;
        }
        table.responsive-table tr {
          border-bottom: 1px solid var(--border);
          padding: 10px 0;
        }
        table.responsive-table tbody tr:last-child {
          border-bottom: 0;
        }
        table.responsive-table td {
          display: grid;
          grid-template-columns: minmax(94px, 34%) minmax(0, 1fr);
          gap: 10px;
          padding: 8px 0;
          border-bottom: 0;
        }
        table.responsive-table td::before {
          content: attr(data-label);
          color: var(--muted);
          font-weight: 650;
        }
        table.responsive-table td[data-label=""] {
          display: block;
        }
        table.responsive-table td[data-label=""]::before {
          content: none;
        }
        .detail-grid,
        .layout-grid,
        .metric-grid {
          grid-template-columns: 1fr;
        }
        .definition-row {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <dialog class="message-dialog" id="message-dialog" aria-labelledby="message-dialog-title">
      <form class="message-dialog-panel" method="dialog">
        <div class="message-dialog-header">
          <h2 class="message-dialog-title" id="message-dialog-title">详情</h2>
          <button class="button secondary" type="submit">关闭</button>
        </div>
        <pre class="message-dialog-body" id="message-dialog-body"></pre>
      </form>
    </dialog>
    <script>
      const localDateTimeFormatter = new Intl.DateTimeFormat(undefined, {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZoneName: "short",
      });

      for (const element of document.querySelectorAll("[data-local-datetime]")) {
        const rawValue = element.getAttribute("data-local-datetime");
        if (!rawValue) {
          continue;
        }

        const parsed = new Date(rawValue);
        if (Number.isNaN(parsed.getTime())) {
          continue;
        }

        element.textContent = localDateTimeFormatter.format(parsed);
      }

      const messageDialog = document.getElementById("message-dialog");
      const messageDialogTitle = document.getElementById("message-dialog-title");
      const messageDialogBody = document.getElementById("message-dialog-body");

      for (const trigger of document.querySelectorAll("[data-dialog-body]")) {
        trigger.addEventListener("click", () => {
          messageDialogTitle.textContent = trigger.getAttribute("data-dialog-title") || "详情";
          messageDialogBody.textContent = trigger.getAttribute("data-dialog-body") || "";

          if (typeof messageDialog.showModal === "function") {
            messageDialog.showModal();
          } else {
            window.alert(messageDialogBody.textContent);
          }
        });
      }
    </script>
  </body>
</html>
