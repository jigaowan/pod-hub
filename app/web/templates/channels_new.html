{% extends "base.html" %}
{% block title %}New Channel - Pod Hub{% endblock %}
{% block content %}
  <section class="header">
    <div>
      <h1>新增频道</h1>
      <p class="muted">支持频道 URL、<code>@handle</code> 或频道 ID。</p>
    </div>
    <div class="actions">
      <a class="button secondary" href="/admin/channels">返回列表</a>
    </div>
  </section>

  <section class="panel stack">
    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/channels">
      <label for="source_input">频道标识</label>
      <input id="source_input" name="source_input" type="text" value="{{ source_input }}" placeholder="https://www.youtube.com/@example">
      <button class="button" type="submit">保存频道</button>
    </form>
    <p class="muted">保存后不会立即触发同步，等待调度器按周期执行首次扫描。</p>
  </section>
{% endblock %}
